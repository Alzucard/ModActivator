; ModActivator known mods
;
; What popular mods' shortcuts do, for mods whose own config files do not say.
; This file is built into ModActivator.asi (scripts/build.py), since DMM does
; not install it as a file of its own, so every update replaces it: put your
; own names and notes in the Hotkeys tab instead, which keeps them in
; ModActivator.User.ini, a file updates never touch. A file of this name
; beside ModActivator.asi is read at every refresh too, but only adds config
; files the built-in list does not know, and [@reserved] keys. It is UTF-8.
;
; [ConfigFile.ini]          The mod's config file, by file name, matched
;                           without regard to case. A path such as
;                           [CrimsonFastLoad/startup.ini] matches that
;                           folder and file.
; @mod = Name | About       The mod's display name and a one-line summary.
; @numbers = hex            Bare key codes in this file are hexadecimal
;                           (73 is F4), not decimal.
; @reload = live            The mod rereads its config while the game runs,
;                           so an edited shortcut works at once.
; @reload = ReloadKey       The key (Key or Section/Key, in this file) that
;                           makes it reread its config: ModActivator presses
;                           it after saving an edit, so no restart is needed.
; @edit = Message           The hotkey editor leaves this file alone (the mod
;                           writes it back over from memory) and shows the
;                           message instead.
; Key = kind | Name | What it does | Modifiers | Controller setting
; Section/Key = ...         Only in that section. One * in the section
;                           matches any run of characters (Preset* every
;                           section starting Preset), and a Name of * is
;                           the part it matched ([Shortcut.a.toggle] under
;                           Shortcut.*.toggle is a). An entry for one
;                           section takes the Modifiers, What it does and
;                           Controller setting it leaves out from the most
;                           specific * entry covering it; a field of - takes
;                           nothing.
;
; kind is menu (opens a window: shown on the Mod menus tab), toggle (switches
; something on and off: the Toggles tab) or action (anything else: the
; Hotkeys tab only). A key listed here is read as a shortcut even when its
; name does not look like one. Key = ignore marks a setting that only looks
; like a shortcut (a flag called HotkeyCtrl), so it is not listed.
;
; Modifiers, optional, are ones the mod requires but its value does not
; spell out, separated by spaces:
;   Ctrl, Shift, Alt     always pressed with the key
;   Ctrl?Field           Ctrl when the setting Field, in the same section, is
;                        not 0 (as with HotkeyCtrl=1)
;   =Field               the modifier the setting Field names (ALT, 18...)
;
; Controller setting, optional, is the setting holding the same action's
; controller buttons, when ModActivator cannot find it by name (it looks for
; the value's own |suffix, then settings such as PadToggle for ToggleKey or
; StanceCycleButtons for StanceCycleKey).
;
; [@reserved] lists keys something other than a mod uses, so a mod bound to
; one is marked as a conflict:  Keys = Who uses them. Add your own (the game's
; own keys, say) under [ReservedKeys] in ModActivator.User.ini, the same way.
;
; Sources: each mod's Nexus Mods page and the comments in its own config
; file. Descriptions are written for ModActivator, not copied.

[@reserved]
F12 = Steam: screenshot (default key)
Shift+Tab = Steam: overlay (default key)
Alt+Tab = Windows: switch window
Alt+F4 = Windows: close the game
Ctrl+Shift+Esc = Windows: Task Manager
PrintScreen = Windows: screenshot (Snipping Tool)

[BloodLifetime20302.ini]
@mod = Crimson Carnage | More blood, lasting stains and bloodied bodies.
Menu/ActivationKeyVK = menu | Blood settings | Opens the Crimson Carnage settings menu.

