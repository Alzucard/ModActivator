; ModActivator known mods
;
; What popular mods' shortcuts do, for mods whose own config files do not say.
; ModActivator reads this file from its own folder at every refresh. It is
; UTF-8 text, and it is replaced when ModActivator is updated: put your own
; names and notes in the Hotkeys tab instead, which keeps them in
; ModActivator.User.ini, a file updates never touch.
;
; [ConfigFile.ini]          The mod's config file, by file name, matched
;                           without regard to case. A path such as
;                           [CrimsonFastLoad/startup.ini] matches that
;                           folder and file.
; @mod = Name | About       The mod's display name and a one-line summary.
; @numbers = hex            Bare key codes in this file are hexadecimal
;                           (73 is F4), not decimal.
; Key = kind | Name | What it does | Modifiers
; Section/Key = ...         Only in that section. A section ending in *
;                           matches every section starting with it.
;
; kind is menu (opens a window: shown on the Mod menus tab), toggle (switches
; something on and off: the Toggles tab) or action (anything else: the
; Hotkeys tab only). A key listed here is read as a shortcut even when its
; name does not look like one. Key = ignore marks a setting that only looks
; like a shortcut (a flag called HotkeyCtrl), so it is not listed.
;
; Modifiers, optional, are ones the mod requires but its value does not
; spell out, separated by spaces:
;   Ctrl, Shift, Alt     always pressed with the key
;   Ctrl?Field           Ctrl when the setting Field, in the same section, is
;                        not 0 (as with HotkeyCtrl=1)
;   =Field               the modifier the setting Field names (ALT, 18...)
;
; Sources: each mod's Nexus Mods page and the comments in its own config
; file. Descriptions are written for ModActivator, not copied.

[BloodLifetime20302.ini]
@mod = Crimson Carnage | More blood, lasting stains and bloodied bodies.
Menu/ActivationKeyVK = menu | Blood settings | Opens the Crimson Carnage settings menu.

[BodyPhysics.ini]
@mod = Two Reasons | Full-body physics for women in Crimson Desert.
ActivationKeyVK = menu | Physics settings | Opens the Two Reasons physics menu.

[BreathMeterStudio.ini]
@mod = Breath Meter Studio | Move, resize and restyle the underwater breath meter.
VirtualKey = menu | Breath meter editor | Opens the editor for the underwater breath meter.

[BulletTime.ini]
@mod = Bullet Time | Slows the world down while you keep moving at normal speed.
ActivationKey = toggle | Bullet time | Turns slow motion on or off.

[CardGameHacker.ini]
@mod = CardGameHacker | Shows cards, hand types and odds in the Duo card game (Insert by default).

[CD_VerticalFlight.ini]
@mod = Vertical Flight | Hold Caps Lock while gliding to fly upwards, as Kliff or Damiane.

[CDWiki.ini]
@mod = Mount and Pet Wiki | In-game wiki for every mount and pet.
CDWiki/ToggleKey = menu | Wiki | Opens or closes the mount and pet wiki.

[CohabitationGateExperiment.ini]
@mod = Harem | Multiple marriages and a partner manager.
ManagerHotkey = menu | Partner manager | Opens the partner manager: preferred partner, rename, reset and appearance.

[CombatEvolved.ini]
@mod = Combat Evolved | Kliff fights with Damiane's and Oongka's moves and gear.
StanceCycleKey = action | Cycle stance | Switches to the next fighting style: Kliff's, Damiane's or Oongka's.
StanceKliffKey = action | Kliff's stance | Switches straight to Kliff's own fighting style.
StanceDamianeKey = action | Damiane's stance | Switches straight to Damiane's fighting style.
StanceOongkaKey = action | Oongka's stance | Switches straight to Oongka's fighting style.
MarkKey = action | Log mark | Puts a mark in CombatEvolved.log, for bug reports.

[CrimsonCollection.ini]
@mod = Crimson Collection | An in-game checklist of the armour you are still missing.
MenuKey = menu | Collection window | Opens or closes the armoury checklist.

[CrimsonDesertEquipHide.ini]
@mod = Gear Hider | Hides equipped gear by category without unequipping it.
ShowAllHotkey = action | Show all gear | Shows every hidden piece of gear again.
HideAllHotkey = action | Hide all gear | Hides every equipped piece of gear.
UserPreset*/ToggleHotkey = toggle | Toggle preset | Shows or hides the gear chosen in this preset.
UserPreset*/ShowHotkey = action | Show preset | Shows the gear chosen in this preset.
UserPreset*/HideHotkey = action | Hide preset | Hides the gear chosen in this preset.
ToggleHotkey = toggle | Toggle gear | Shows or hides the gear this section covers.
ShowHotkey = action | Show gear | Shows the gear this section covers.
HideHotkey = action | Hide gear | Hides the gear this section covers.

[CrimsonDesertLiveTransmog.ini]
@mod = Live Transmog | Changes how your armour looks without changing its stats.
OverlayToggleHotkey = menu | Transmog window | Opens or closes the Live Transmog window.
ToggleHotkey = toggle | Transmog on/off | Switches between the chosen appearance and your real armour.
ApplyHotkey = action | Apply appearance | Applies the appearance chosen in the window.
ClearHotkey = action | Clear appearance | Removes the transmog and shows your real armour.
NextHotkey = action | Next appearance | Steps to the next saved appearance.
PrevHotkey = action | Previous appearance | Steps back to the previous saved appearance.

[CrimsonFastLoad/startup.ini]
@mod = Crimson FastLoad | Faster start-up, loads and animations, with its own menu.
Menu/Hotkey = menu | FastLoad menu | Opens the Crimson FastLoad menu, where every feature has its own switch.
Startup/InstantResumeHotkey = action | Quick pause | Pressed with Ctrl, pauses or resumes the game instantly.

[CrimsonHUD.ini]
@mod = EEA HUD Resizer | Resize, move, fade or hide each part of the HUD, live.
MenuKey = menu | HUD editor | Opens the HUD Resizer window.

[CrimsonInvEditor.ini]
@mod = Crimson Desert Enhanced | Trainer and inventory editor with its own in-game menu.

[CrimsonRoute.ini]
@mod = Crimson Route | Road-following routes to quests and markers on the map and minimap.
SettingsWindow/ManageLocationsHotkey = menu | Settings window | Opens Crimson Route's settings and saved locations.
WorldRoute/ToggleVisibilityHotkey = toggle | Route in the world | Shows or hides the route drawn on the road ahead.
Routing/AlternativeRouteHotkey = action | Alternative route | Switches to the alternative route.
AutoMove/ToggleHotkey = toggle | Auto-move | Starts or stops moving along the selected route.
AutoMove/ModeHotkey = action | Auto-move pace | Cycles walking, running and sprinting while auto-moving.

[CrimsonTelescope.ini]
@mod = CrimsonTelescope | Hold a button to zoom in like a telescope.

[CrimsonWeather.ini]
@mod = Crimson Weather | Real-time weather and environment control, through ReShade.
General/HotkeyToggleEffect = toggle | Weather effect | Turns Crimson Weather's effect on or off.

[CalmerDynamicWind.ini]
@mod = Calmer Dynamic Wind | Calmer wind on grass and trees, weather still changes.
Hotkeys/ToggleKey = toggle | Calmer wind | Switches between the calmer wind and the game's own, to compare.
Hotkeys/DisableKey = action | Disable until restart | Turns the mod off until the game is restarted.

[DesertLinkAddItem.ini]
@mod = DesertLink Add Any Item | Searchable in-game item spawner.
OpenKeyVk = menu | Item spawner | Opens the item spawner.

[DesertLinkDyeStudio.ini]
@mod = Dye Studio | Live dyes for gear and items, including ones the game cannot dye.
OpenKeyVk = menu | Dye Studio | Opens Dye Studio.
OpenKey2Vk = menu | Dye Studio (second key) | Opens Dye Studio. | =OpenKey2WithVk

[DesertLinkFlashMode.ini]
@mod = DesertLink Speedster | Super speed with the world slowed down.
ToggleKey = toggle | Speedster mode | Turns speedster mode on or off.
SpeedUpKey = action | Faster | Raises your speed.
SpeedDownKey = action | Slower | Lowers your speed.
ReloadKey = action | Reload settings | Reads the config file again without restarting.

[DesertLinkGhostMode.ini]
@mod = Ghost Mode | Become undetectable and assassinate at any time.
ToggleKey = toggle | Ghost mode | Turns ghost mode on or off. Turning it on drops enemy aggro.

[DesertLinkInstantConquest.ini]
@mod = Instant Base Conquest | One kill captures an enemy base.
ToggleKey = toggle | Instant conquest | Turns instant conquest on or off.

[DesertLinkInventoryManager.ini]
@mod = DesertLink Inventory Editor | Edit, spawn and move items between storages.
OpenKeyVk = menu | Inventory editor | Opens the inventory editor.
OpenKey2Vk = menu | Inventory editor (second key) | Opens the inventory editor. | =OpenKey2WithVk

[DropFilters.ini]
@mod = Drop Control | Loot filters for enemy drops. Shift+F7 opens its Control Center, Shift+F6 turns the filters on or off.

[DynamicScalify.ini]
@mod = Dynamic Scalify | In-game character scaling for Kliff, Damiane and Oongka.
OpenMenu = menu | Scaling menu | Opens the character scaling menu.

[EnhancedFlight.ini]
@mod = Enhanced Flight | True flight: hold Caps Lock to climb and Left Shift to descend.

[FreedomFlyer.ini]
@mod = Freedom Flyer | Flight and hover: tap to toggle hover, hold for a short hover.

[GlintSpotter.ini]
@mod = Glint Spotter | Pins what you look at on the map, removed once picked up.

[HeroineOfPywel.ini]
@mod = Heroine of Pywel | Kliff as a woman, styled with the game's own barber.
ModeKey = action | Next barber view | At the barber, switches the second tab to Head, Body or Face Details.
PrevModeKey = action | Previous barber view | At the barber, switches the second tab back.
CaptureKey = action | Capture head picture | Saves a picture of her head. Press again to stop early.
CaptureTestKey = action | Test capture | Saves one test picture and the framing, to check before capturing.

[InstantSurgery.ini]
@mod = Instant Surgery | In-game body and outfit editor.
General/ActivationKeyVK = menu | Body editor | Opens the Instant Surgery body editor.

[JustSkip.ini]
@mod = JustSkip | Game speed control: toggle 1.2x, 2x or 4x, or hold for 8x.

[KC- Gilded Compass.ini]
@mod = Gilded Compass | A styled compass with map icons on screen, placed and skinned from its menu.
Menu/HotkeyVk = menu | Compass menu | Opens the Gilded Compass menu: style, icons and placement. | Ctrl?HotkeyCtrl
Menu/MapHotkeyVk = toggle | Minimap | Hides or shows the minimap. | Ctrl
Menu/HotkeyCtrl = ignore

[ModHub.ini]
@mod = Mod Hub | One menu that opens other mods' menus.
General/ActivationKeyVK = menu | Mod Hub | Opens Mod Hub, which lists the mods it manages.

[MasterLooter.ini]
@mod = Master Looter | Auto-loot with a menu: Insert opens it, F10 auto-loot on/off, F11 loots everything in range.

[PetLootToggle.ini]
@mod = Pet Loot Collection Toggle | Control Center for what your pets loot.

[Phase.ini]
@mod = Phase | Short teleport in the direction you are moving.

[PrivateStorageAnywhere.ini]
@mod = Private Storage Anywhere | Opens your storage chests from anywhere.
@numbers = hex
PrivateHotkey = menu | Private Storage | Opens your Private Storage.
GatherablesHotkey = menu | Gatherables chest | Opens the housing Gatherables chest.
DresserHotkey = menu | Dresser | Opens the housing Dresser.
RefrigeratorHotkey = menu | Refrigerator | Opens the housing Refrigerator.
SymbolHotkey = menu | Symbol chest | Opens the housing Symbol chest.
CollectingHotkey = menu | Collecting chest | Opens the housing Collecting chest.
ReloadKey = action | Reload settings | Reads the config file again without restarting.

[PrivateStorageMaster.ini]
@mod = Private Storage Master | Opens storage, housing chests, camp bins and warehouses from anywhere (Ctrl+F1 to F9).

[OpenStorageAnywhere.ini]
@mod = Open Storage Anywhere | F4 to F9 open your storages. F10 teleports to your map marker.

[Quicksaveandreload.ini]
@mod = Quick Save and Reload | A quicksave slot with keys to save and reload.
HotkeyQuickSave = action | Quicksave | Saves to the quicksave slot.
HotkeyQuickLoad = action | Quickload | Loads the quicksave.

[QuickMenuHotkeys.ini]
@mod = Quick Menu Hotkeys | Opens game menus directly: I inventory, J journal, K skills, L knowledge, M map.

[Seasons.ini]
@mod = Seasons of Pywel | Four seasons that follow the in-game calendar. F5 opens its control menu.

[SuperGlide.ini]
@mod = Super Glide | Powered, camera-directed flight from Kliff's glide.
BrakeKey = action | Brake | Hold while gliding to slow down.
RiseKey = action | Rise | Hold while gliding to climb.
DescendKey = action | Descend | Hold while gliding to dive.

[SwiftQuestFollow.ini]
@mod = SwiftQuestFollow | Follows quest NPCs for you and speeds the game up while following. F10 opens its menu.

[Trinity.ini]
@mod = Trinity | Mod menu with its own overlay. Keys are set in System > Keybinds.

[WaypointRoute.ini]
@mod = Waypoint Route | Road-following route to your map waypoint.
ReloadKey = action | Reload settings | Reads WaypointRoute.ini again while the game runs.

[WayPointTeleport.ini]
@mod = WayPoint Teleport | Teleports you to your active map waypoint (F5 by default, map closed).

[AmbientMixer.ini]
@mod = Ambient Sounds Control | Boost nature sounds or mute unwanted ones. F2 opens it while paused.
