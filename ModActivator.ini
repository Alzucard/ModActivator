[General]
; The panel shortcut. Changing it in the menu (Settings) saves your choice to
; ModActivator.User.ini, beside this file, which wins over this line. Updates
; replace this file but never ModActivator.User.ini, which also keeps your
; binding types, tabs, card order, and names and notes.
OpenShortcut=Ctrl+Shift+Backspace
; 1 draws through ReShade's add-on callbacks when ReShade 6.8.0 or newer is loaded (older ReShade falls back automatically). 0 always uses the legacy DirectX path. Restart to apply.
UseReShadeEvents=1
; Set 1 only if the overlay is invisible with frame generation. Restart to apply.
WrapSwapChain=0
; 0 leaves the controller alone, so it still reaches the game while the menu is open. Restart to apply.
HookXInput=1
; Set 1 to log cursor and raw input diagnostics each time the menu opens. Restart to apply.
DebugInput=0
