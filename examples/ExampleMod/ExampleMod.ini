; Example Mod settings. ModActivator reads this file as it is: the key names,
; the values and the comment above each key.

[Menu]
; Opens or closes the Example Mod window.
MenuKey=Ctrl+F7

[Effect]
; Turns the example effect on or off.
ToggleKey=F8
; The same on a controller: hold LB, press Down on the d-pad.
ToggleButtons=LB+Down
